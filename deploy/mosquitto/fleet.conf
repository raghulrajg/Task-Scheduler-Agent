# Mosquitto broker config for the robot fleet.
# Copy to /etc/mosquitto/conf.d/fleet.conf and restart mosquitto.

# Keep persistent sessions + queued QoS1 messages across broker restarts.
persistence true
persistence_location /var/lib/mosquitto/
# Drop sessions of clients that have been gone for a day.
persistent_client_expiration 1d
max_queued_messages 1000

# TLS listener (robots on Wi-Fi). Generate certs with your site CA.
listener 8883
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile  /etc/mosquitto/certs/broker.key
tls_version tlsv1.2

# No anonymous access; one account per role/machine.
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
